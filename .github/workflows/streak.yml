name: Update JST streak

on:
  schedule:
    - cron: "0 15 * * *" # 毎日 00:00 JST
    - cron: "0 3 * * *"  # 毎日 12:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/streak.mjs
        env:
          GH_TOKEN: ${{ secrets.STREAK_TOKEN }}
          USERNAME: hiiragi17
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-jst.svg
          git diff --cached --quiet || git commit -m "Update JST streak" && git push
